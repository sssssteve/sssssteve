<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">From demonstrations to robot behavior</title>
  <desc id="desc">Four areas of my work: collect demonstrations, learn policies, deploy on robots, and evaluate behavior. This illustrates the workflow, not measured results.</desc>
  <rect width="900" height="190" rx="16" fill="#101d30"/>
  <g font-family="Arial, sans-serif">
    <text x="28" y="31" fill="#93c5fd" font-size="11" letter-spacing="2">FROM DEMONSTRATIONS TO ROBOT BEHAVIOR</text>
    <g fill="#162b44" stroke="#304963">
      <rect x="28" y="52" width="190" height="110" rx="10"/>
      <rect x="246" y="52" width="190" height="110" rx="10"/>
      <rect x="464" y="52" width="190" height="110" rx="10"/>
      <rect x="682" y="52" width="190" height="110" rx="10"/>
    </g>
    <g fill="#60a5fa" font-size="11" letter-spacing="1">
      <text x="44" y="77">01 / DATA</text>
      <text x="262" y="77">02 / MODELS</text>
      <text x="480" y="77">03 / CONTROL</text>
      <text x="698" y="77">04 / EVIDENCE</text>
    </g>
    <g fill="#f1f5f9" font-size="21" font-weight="700">
      <text x="44" y="107">Collect</text>
      <text x="262" y="107">Learn</text>
      <text x="480" y="107">Deploy</text>
      <text x="698" y="107">Evaluate</text>
    </g>
    <g fill="#b6c7da" font-size="12">
      <text x="44" y="130">WebXR · Teleoperation</text>
      <text x="44" y="148">Bimanual demonstrations</text>
      <text x="262" y="130">Ego–robot learning</text>
      <text x="262" y="148">VLA · World–action models</text>
      <text x="480" y="130">OpenPI · Piper</text>
      <text x="480" y="148">RTC · Temporal ensemble</text>
      <text x="698" y="130">Offline policy evaluation</text>
      <text x="698" y="148">Real-robot review</text>
    </g>
    <g fill="#93c5fd" font-size="20" text-anchor="middle">
      <text x="232" y="114">→</text>
      <text x="450" y="114">→</text>
      <text x="668" y="114">→</text>
    </g>
  </g>
</svg>
